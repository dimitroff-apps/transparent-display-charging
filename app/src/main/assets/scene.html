<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transparent Display Charging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #000;
    --ink: #e9f1ff;
    --muted: rgba(233, 241, 255, 0.62);
    --panel: rgba(10, 14, 24, 0.94);
    --btn: rgba(255, 255, 255, 0.08);
    --line: rgba(160, 200, 255, 0.18);
    --disp: 120, 255, 190;
  }
  /* The scene is a dark X-ray view in both system themes */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --ink: #e9f1ff; --panel: rgba(10, 14, 24, 0.94); }
  }
  :root[data-theme="dark"] { --bg: #000; --ink: #e9f1ff; --panel: rgba(10, 14, 24, 0.94); }

  html, body { height: 100%; margin: 0; }
  html { background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: 'Exo 2', 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #scene { position: fixed; top: 0; left: 0; display: block; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    font-size: 14px; color: var(--muted); background: rgba(0, 0, 0, 0.55); padding: 6px 12px; border-radius: 999px;
    transition: opacity 0.6s; pointer-events: none; white-space: nowrap;
  }
  #panel {
    position: fixed; left: 50%; bottom: 0;
    transform: translate(-50%, 110%);
    width: min(440px, calc(100% - 16px));
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 18px 18px 0 0;
    transition: transform 0.3s cubic-bezier(.2, .8, .2, 1);
  }
  #panel.open { transform: translate(-50%, 0); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  button {
    flex: 1; font: inherit; font-weight: 600; font-size: 15px; color: var(--ink);
    background: var(--btn); border: 0; border-radius: 10px; padding: 10px; cursor: pointer;
  }
  button.on { background: rgb(var(--disp)); color: #04110a; }
  button:focus-visible, input:focus-visible { outline: 2px solid rgb(var(--disp)); outline-offset: 2px; }
  .speed { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); width: 100%; }
  .speed input { flex: 1; accent-color: rgb(var(--disp)); }
  #spd { width: 2.6em; text-align: right; }
  #status { font-size: 14px; color: var(--muted); margin: 0 0 12px; min-height: 1.2em; }
  .chips { justify-content: center; gap: 14px; }
  .chip {
    flex: 0 0 34px; width: 34px; height: 34px; padding: 0; border-radius: 50%;
    background: linear-gradient(135deg, var(--a), var(--b));
    border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line);
  }
  .chip.on { border-color: #fff; box-shadow: 0 0 14px var(--b); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">Докосни за настройки</div>

<div id="panel" role="dialog" aria-label="Настройки">
  <div class="row">
    <button id="mCharge" class="on">Демо зареждане</button>
    <button id="mDrain">Демо разреждане</button>
  </div>
  <div class="row"><button id="mReal">Моята батерия</button></div>
  <p id="status">Симулирано зареждане от 40% до 99.999%</p>
  <div class="row">
    <button id="pause">Пауза</button>
    <button id="restart">Отначало</button>
  </div>
  <div class="row" id="speedRow">
    <label class="speed">Скорост <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"><span id="spd">1×</span></label>
  </div>
  <div class="row"><button id="close">Затвори</button></div>
</div>

<script>
// If the scene fails on some phone, show why on screen so it can be reported
window.addEventListener('error', e => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;color:#ff8a80;font:12px monospace;background:rgba(0,0,0,.8);padding:8px;z-index:9;white-space:pre-wrap';
  d.textContent = 'Грешка: ' + e.message + '\n' + (e.filename || '').split('/').pop() + ':' + e.lineno + '\n' + navigator.userAgent;
  document.body.appendChild(d);
});
</script>
<script>
(() => {
  // Colours follow the state: green while charging, orange on battery, red under 20%
  const STATES = {
    charge: { flow: [160, 255, 150], particle: [130, 255, 185], deep: [0, 90, 45],   hot: [110, 255, 140], glass: [100, 255, 170], display: [125, 255, 165] },
    drain:  { flow: [255, 180, 70],  particle: [255, 205, 120], deep: [170, 55, 5],  hot: [255, 160, 40],  glass: [255, 165, 90],  display: [255, 190, 100] },
    low:    { flow: [255, 95, 80],   particle: [255, 145, 130], deep: [130, 8, 12],  hot: [255, 70, 55],   glass: [255, 105, 100], display: [255, 115, 100] }
  };
  const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const WHITE = [255, 255, 255];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const params = new URLSearchParams(location.search);

  // Colours picked in the app (?cc= charging, ?dc= on battery, ?tc= percentage text), as RRGGBB
  const hex = k => { const v = params.get(k); return /^[0-9a-fA-F]{6}$/.test(v || '') ? [0, 2, 4].map(i => parseInt(v.substr(i, 2), 16)) : null; };
  const paletteFrom = c => ({
    flow: mix(c, WHITE, 0.4), particle: mix(c, WHITE, 0.5), deep: c.map(v => Math.round(v * 0.35)),
    hot: mix(c, WHITE, 0.15), glass: mix(c, WHITE, 0.35), display: mix(c, WHITE, 0.45)
  });
  if (hex('cc')) STATES.charge = paletteFrom(hex('cc'));
  if (hex('dc')) STATES.drain = paletteFrom(hex('dc'));
  if (hex('tc')) for (const s of Object.values(STATES)) s.display = hex('tc');
  // Look: 'xray' = the phone seen through the display, 'photo' = macro shot inside the battery cell
  const STYLE = params.get('style') === 'photo' ? 'photo' : 'xray';
  const NATIVE = !!window.AndroidBattery;
  const DEMO = params.get('demo');
  let CUT = null; // real punch-hole position from the phone
  // Per-model layouts, front view (mirrored from teardown photos)
  const T = (cam, n, soc, label, extra) => Object.assign({ cam, n, soc, label }, extra || {});
  const LAYOUTS = {
    s26u: T('col', 4, 'SM8850', 'Li-ion 5000 mAh', { spen: true }), s26p: T('col', 3, 'SoC', 'Li-ion 4900 mAh'), s26: T('col', 3, 'SoC', 'Li-ion 4300 mAh'),
    s25u: T('col', 4, 'SM8750', 'Li-ion 5000 mAh', { spen: true }), s25p: T('col', 3, 'SM8750', 'Li-ion 4900 mAh'), s25: T('col', 3, 'SM8750', 'Li-ion 4000 mAh'),
    s24u: T('col', 4, 'SM8650', 'Li-ion 5000 mAh', { spen: true }), s24p: T('col', 3, 'SoC', 'Li-ion 4900 mAh'), s24: T('col', 3, 'SoC', 'Li-ion 4000 mAh'),
    x17u: T('circleC', 3, 'SM8850', 'Si/C 6800 mAh'), x17pm: T('band', 3, 'SM8850', 'Si/C 7500 mAh'), x17p: T('band', 3, 'SM8850', 'Si/C 6300 mAh'), x17: T('square', 3, 'SM8850', 'Si/C 7000 mAh'),
    x15u: T('circleC', 4, 'SM8750', 'Si/C 5410 mAh'), x15p: T('square', 3, 'SM8750', 'Si/C 6100 mAh'), x15: T('square', 3, 'SM8750', 'Si/C 5400 mAh'),
    x14u: T('circleC', 4, 'SM8650', 'Li-ion 5000 mAh'), x14p: T('square', 3, 'SM8650', 'Li-ion 4880 mAh'), x14: T('square', 3, 'SM8650', 'Li-ion 4610 mAh'),
    p11px: T('bar', 3, 'Tensor G6', 'Li-ion 5000 mAh'), p11p: T('bar', 3, 'Tensor G6', 'Li-ion'), p11: T('bar', 2, 'Tensor G6', 'Li-ion'),
    p10px: T('bar', 3, 'Tensor G5', 'Li-ion 5200 mAh'), p10p: T('bar', 3, 'Tensor G5', 'Li-ion 4870 mAh'), p10: T('bar', 3, 'Tensor G5', 'Li-ion 4970 mAh'),
    p9px: T('bar', 3, 'Tensor G4', 'Li-ion 5060 mAh'), p9p: T('bar', 3, 'Tensor G4', 'Li-ion 4700 mAh'), p9: T('bar', 2, 'Tensor G4', 'Li-ion 4700 mAh'),
    op15: T('square', 3, 'SM8850', 'Si/C 7300 mAh', { dual: true }), op13: T('circleR', 3, 'SM8750', 'Si/C 6000 mAh'), op12: T('circleR', 3, 'SM8650', 'Li-ion 5400 mAh'),
    motosig: T('square', 3, 'SM8845', 'Si/C 5200 mAh'), moto60p: T('square', 3, 'SoC', 'Si/C 6000 mAh'), moto50u: T('square', 3, 'SM7675', 'Li-ion 4500 mAh'),
    thinkp: T('col', 3, 'SM8475', 'Li-ion 5000 mAh'), motog5gp: T('col', 3, 'SM7250', 'Li-ion 5000 mAh'),
    u61: T('square', 3, 'SoC', 'Li-ion'), u64: T('square', 3, 'SoC', 'Li-ion'), u67: T('circleR', 3, 'SoC', 'Li-ion'), u69: T('bar', 3, 'SoC', 'Li-ion')
  };
  const CFG = LAYOUTS[params.get('theme')] || LAYOUTS.x15;
  window.setCutout = (x, y, r) => { CUT = { x, y, r }; };

  const C = document.getElementById('scene');
  const ctx = C.getContext('2d');
  const base = document.createElement('canvas');
  let W = 0, H = 0, dpr = 1;
  let px = 0, py = 0, pw = 0, ph = 0; // phone rectangle (the whole screen on a phone)
  const X = f => px + f * pw, Y = f => py + f * ph, S = f => f * pw;
  let theme, spr = {};

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function metal(c, x, y, w, h, light) {
    const g = c.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, light ? '#c9d0da' : '#7d8593');
    g.addColorStop(0.45, light ? '#8f98a6' : '#555d6a');
    g.addColorStop(1, light ? '#aab2bf' : '#3d434e');
    return g;
  }

  // Seeded random so the board looks the same after every resize
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---------- Static layer: frame, boards and parts (front view, as if through the display) ----------
  function buildBase() {
    base.width = W * dpr; base.height = H * dpr;
    const c = base.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
    seed = 7;

    // Mid-frame
    rr(c, px, py, pw, ph, S(0.1));
    let g = c.createLinearGradient(px, py, px + pw, py + ph);
    g.addColorStop(0, '#1c1f26'); g.addColorStop(0.5, '#121418'); g.addColorStop(1, '#0b0c0f');
    c.fillStyle = g; c.fill();
    c.save(); c.clip();
    for (let i = 0; i < 260; i++) {
      c.fillStyle = `rgba(255,255,255,${0.01 + rnd() * 0.02})`;
      c.fillRect(px, py + rnd() * ph, pw, 0.6);
    }
    c.restore();
    rr(c, X(0.022), Y(0.012), pw * 0.956, ph * 0.976, S(0.08));
    c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 1; c.stroke();

    // Wireless charging coil, seen behind the glass battery
    const ccx = X(0.5), ccy = Y(0.58);
    c.beginPath(); c.arc(ccx, ccy, S(0.33), 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,0.45)'; c.fill();
    c.lineWidth = Math.max(1, S(0.006));
    for (let r = S(0.07); r < S(0.31); r += S(0.013)) {
      c.beginPath(); c.arc(ccx, ccy, r, 0, Math.PI * 2);
      c.strokeStyle = 'rgba(205,125,60,0.3)'; c.stroke();
    }

    // Main flex cable along the side
    const fx = X(0.088), fw = S(0.026);
    c.fillStyle = 'rgba(205,125,35,0.85)'; c.fillRect(fx, Y(0.27), fw, Y(0.89) - Y(0.27));
    c.strokeStyle = 'rgba(255,205,130,0.55)'; c.lineWidth = 0.8;
    for (let j = 1; j < 4; j++) { c.beginPath(); c.moveTo(fx + fw * j / 4, Y(0.27)); c.lineTo(fx + fw * j / 4, Y(0.89)); c.stroke(); }

    // Main board, with a cut-out around the rear cameras
    const G = GEO, isl = G.island;
    c.beginPath();
    if (c.roundRect) c.roundRect(X(0.03), Y(0.018), pw * 0.94, G.board - Y(0.018), S(0.06)); else c.rect(X(0.03), Y(0.018), pw * 0.94, G.board - Y(0.018));
    if (isl.kind === 'circle') { c.moveTo(isl.cx + isl.r, isl.cy); c.arc(isl.cx, isl.cy, isl.r, 0, Math.PI * 2); }
    else if (c.roundRect) c.roundRect(isl.x, isl.y, isl.w, isl.h, S(0.04)); else c.rect(isl.x, isl.y, isl.w, isl.h);
    c.fillStyle = '#0b1626'; c.fill('evenodd');
    c.save(); c.clip('evenodd');
    pcbDetails(c, X(0.03), Y(0.018), pw * 0.94, G.board - Y(0.018), 70);
    c.restore();
    if (isl.kind === 'circle') {
      c.beginPath(); c.arc(isl.cx, isl.cy, isl.r, 0, Math.PI * 2);
      c.strokeStyle = metal(c, isl.cx - isl.r, isl.cy - isl.r, isl.r * 2, isl.r * 2, true); c.lineWidth = S(0.012); c.stroke();
    }
    // Rear display of the Xiaomi 17 Pro models, seen from behind
    if (G.rearDisplay) {
      const d = G.rearDisplay;
      rr(c, d.x, d.y, d.w, d.h, S(0.02)); c.fillStyle = '#0d1a3a'; c.fill();
      c.strokeStyle = 'rgba(120,160,255,0.35)'; c.lineWidth = 1; c.stroke();
      c.fillStyle = 'rgba(200,170,90,0.35)';
      for (let i = 0; i < 10; i++) c.fillRect(d.x + d.w * 0.08 + i * d.w * 0.085, d.y + d.h * 0.82, d.w * 0.03, d.h * 0.1);
    }
    // Rear camera modules (mirrored, seen from the front)
    for (const m of G.mods) {
      const x = m.x, y = m.y, sz = m.s;
      c.fillStyle = 'rgba(210,125,40,0.85)'; c.fillRect(x - S(0.04), y + sz * 0.4, S(0.05), sz * 0.22);
      rr(c, x, y, sz, sz, S(0.015)); c.fillStyle = metal(c, x, y, sz, sz, false); c.fill();
      rr(c, x + sz * 0.14, y + sz * 0.14, sz * 0.72, sz * 0.72, S(0.008)); c.fillStyle = '#0d1016'; c.fill();
      c.fillStyle = 'rgba(255,200,90,0.6)';
      for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) c.fillRect(x + sz * (0.22 + i * 0.13), y + sz * (0.22 + j * 0.13), sz * 0.04, sz * 0.04);
      c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 1; rr(c, x, y, sz, sz, S(0.015)); c.stroke();
      if (STYLE === 'photo') {
        // Lens glass seen from inside: dark coated glass with reflections
        const lx = x + sz / 2, ly = y + sz / 2, lr = sz * 0.34;
        c.beginPath(); c.arc(lx, ly, lr * 1.12, 0, Math.PI * 2); c.fillStyle = metal(c, lx - lr, ly - lr, lr * 2, lr * 2, true); c.fill();
        const lg = c.createRadialGradient(lx - lr * 0.3, ly - lr * 0.3, lr * 0.05, lx, ly, lr);
        lg.addColorStop(0, '#3a4a78'); lg.addColorStop(0.35, '#121a33'); lg.addColorStop(0.8, '#05070d'); lg.addColorStop(1, '#1a2240');
        c.beginPath(); c.arc(lx, ly, lr, 0, Math.PI * 2); c.fillStyle = lg; c.fill();
        for (const [k, a] of [[0.75, 0.25], [0.5, 0.18], [0.28, 0.3]]) {
          c.beginPath(); c.arc(lx, ly, lr * k, Math.PI * 1.1, Math.PI * 1.55);
          c.strokeStyle = `rgba(150,180,255,${a})`; c.lineWidth = Math.max(1, lr * 0.06); c.stroke();
        }
        c.beginPath(); c.arc(lx - lr * 0.35, ly - lr * 0.38, lr * 0.12, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,0.55)'; c.fill();
      }
    }
    if (G.flash) {
      c.beginPath(); c.arc(G.flash.x, G.flash.y, S(0.032), 0, Math.PI * 2);
      c.fillStyle = metal(c, G.flash.x - S(0.032), G.flash.y - S(0.032), S(0.064), S(0.064), true); c.fill();
      c.beginPath(); c.arc(G.flash.x, G.flash.y, S(0.02), 0, Math.PI * 2); c.fillStyle = '#e8d9a8'; c.fill();
    }

    // Shield cans and chips
    shield(c, G.soc.x, G.soc.y, G.soc.w, G.soc.h, CFG.soc);
    shield(c, G.rf.x, G.rf.y, G.rf.w, G.rf.h, 'RF');
    shield(c, G.pmic.x, G.pmic.y, G.pmic.w, G.pmic.h, 'PMIC');
    G.cps.forEach(([x, y]) => chip(c, x, y, S(0.065), 'CP'));
    // Battery board-to-board connector
    rr(c, X(0.70), G.board - S(0.07), S(0.13), S(0.045), S(0.008)); c.fillStyle = '#121418'; c.fill();
    c.fillStyle = 'rgba(255,205,100,0.85)';
    for (let i = 0; i < 9; i++) c.fillRect(X(0.71) + i * S(0.0125), G.board - S(0.058), S(0.005), S(0.02));
    // Earpiece and front camera
    rr(c, X(0.36), Y(0.004), S(0.28), S(0.02), S(0.01)); c.fillStyle = '#08090c'; c.fill();
    c.fillStyle = 'rgba(255,255,255,0.12)';
    for (let i = 0; i < 26; i++) c.fillRect(X(0.37) + i * S(0.01), Y(0.004) + S(0.007), S(0.004), S(0.006));
    const fcx = X(0.5), fcy = Y(0.04), fs = S(0.11);
    c.fillStyle = 'rgba(210,125,40,0.85)'; c.fillRect(fcx - S(0.02), fcy + fs / 2, S(0.04), S(0.03));

    // Battery flex up to the connector
    c.fillStyle = 'rgba(210,130,40,0.9)'; c.fillRect(X(0.725), GEO.board - S(0.03), S(0.08), GEO.battTop - GEO.board + S(0.03));
    c.strokeStyle = 'rgba(255,215,140,0.6)';
    for (let j = 1; j < 4; j++) { c.beginPath(); c.moveTo(X(0.725) + S(0.02) * j, GEO.board - S(0.03)); c.lineTo(X(0.725) + S(0.02) * j, GEO.battTop); c.stroke(); }
    // S Pen in its slot (Galaxy Ultra), bottom left seen from the front
    if (CFG.spen) {
      const sx0 = X(0.093), sw0 = S(0.032), sy0 = Y(0.56), sh0 = Y(0.975) - sy0;
      rr(c, sx0 - S(0.006), sy0 - S(0.006), sw0 + S(0.012), sh0 + S(0.012), sw0 / 2); c.fillStyle = '#07080b'; c.fill();
      rr(c, sx0, sy0, sw0, sh0, sw0 / 2); c.fillStyle = metal(c, sx0, sy0, sw0, sh0, false); c.fill();
      c.fillStyle = 'rgba(199,125,42,0.9)'; c.fillRect(sx0, sy0 + sh0 * 0.86, sw0, S(0.01));
    }

    // Bottom sub-board
    const sx = X(0.03), sy = Y(0.85), sw = pw * 0.94, sh = Y(0.988) - sy;
    rr(c, sx, sy, sw, sh, S(0.06)); c.fillStyle = '#0b1626'; c.fill();
    c.save(); rr(c, sx, sy, sw, sh, S(0.06)); c.clip(); pcbDetails(c, sx, sy, sw, sh, 24); c.restore();
    // Speaker box
    rr(c, X(0.6), Y(0.862), S(0.34), Y(0.972) - Y(0.862), S(0.02)); c.fillStyle = '#0a0b0e'; c.fill();
    c.fillStyle = 'rgba(255,255,255,0.08)';
    for (let i = 0; i < 12; i++) for (let j = 0; j < 7; j++) {
      c.beginPath(); c.arc(X(0.63) + i * S(0.025), Y(0.874) + j * S(0.026), S(0.006), 0, Math.PI * 2); c.fill();
    }
    // Vibration motor
    rr(c, X(0.08), Y(0.866), S(0.24), S(0.08), S(0.04)); c.fillStyle = metal(c, X(0.08), Y(0.866), S(0.24), S(0.08), true); c.fill();
    c.fillStyle = 'rgba(20,24,30,0.55)'; c.font = `600 ${S(0.024)}px "Exo 2", sans-serif`; c.fillText('X-axis', X(0.14), Y(0.866) + S(0.05));
    // SIM tray

  /** Anode granules glow from the bottom up to the charge level */
  function buildGlow(th) {
    const { MW, MH } = PH, c = PH.glow.getContext('2d'), s = 0.5;
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over';
    c.clearRect(0, 0, PH.glow.width, PH.glow.height);
    c.setTransform(dpr * s, 0, 0, dpr * s, MW * MARGIN * dpr * s, MH * MARGIN * dpr * s);
    const ly = MH * (1 - p / 100), gr = c.createLinearGradient(0, ly - MH * 0.02, 0, MH * (1 + MARGIN));
    gr.addColorStop(0, rgba(th.bright, 0)); gr.addColorStop(0.03, rgba(th.bright, 0.95));
    gr.addColorStop(0.1, rgba(th.hot, 0.7)); gr.addColorStop(1, rgba(th.deep, 0.5));
    c.fillStyle = gr; c.fillRect(-MW, ly - MH * 0.02, MW * 3, MH * 1.2);
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'destination-in';
    c.drawImage(PH.mask, 0, 0);
    c.globalCompositeOperation = 'source-over';
  }

  function updatePhoto(t, dt) {
    const { MW, MH } = PH, charging = isCharging(), draining = isDraining(), sp = mode === 'demo' ? speed : 1;
    const rate = reduceMotion ? 1 : charging ? 4 + Math.min(10, watt / 10) : draining ? 2 : 0.2;
    PH.spawn = Math.min(1.5, PH.spawn + rate * dt * sp);
    while (PH.spawn >= 1 && PH.chains.length < 70 && PH.seps.length) {
      PH.spawn -= 1;
      // Charging: from the cathode through a separator into the anode; on battery the other way
      const sep = PH.seps[Math.floor(Math.random() * PH.seps.length)], into = charging || !draining;
      const from = into ? sep.c : sep.a, to = into ? sep.a : sep.c, dir = into ? sep.dir : -sep.dir;
      const depth = Math.random() < 0.35 ? between(0.5, 0.7) : 1, n = 2 + Math.floor(Math.random() * 3);
      PH.chains.push({
        dir, x: between(from.x0, from.x1), end: between(to.x0 + (to.x1 - to.x0) * 0.2, to.x1 - (to.x1 - to.x0) * 0.2),
        y: MH * between(0.02, 0.98), v: MW * between(0.05, 0.09) * (into ? 1 : 0.6) * (charging ? 0.7 + Math.min(1.2, watt / 80) : 0.6),
        n, gap: MW * between(0.018, 0.028) * depth, ph: between(0, 6.28), amp: MH * between(0.002, 0.006), depth, absorbed: 0
      });
    }
    for (let i = PH.chains.length - 1; i >= 0; i--) {
      const c = PH.chains[i];
      c.x += c.dir * c.v * dt * sp;
      // Beads trail behind the head; each one that reaches its granule flashes and is absorbed
      while (c.absorbed < c.n && c.dir * ((c.x - c.dir * c.absorbed * c.gap) - c.end) > 0) {
        PH.flashes.push({ x: c.end, y: c.y + Math.sin(t / 500 + c.ph + c.absorbed * 0.9) * c.amp, life: 1, depth: c.depth });
        c.absorbed++;
      }
      if (c.absorbed >= c.n) PH.chains.splice(i, 1);
    }
    for (let i = PH.flashes.length - 1; i >= 0; i--) { PH.flashes[i].life -= dt * 2.2; if (PH.flashes[i].life <= 0) PH.flashes.splice(i, 1); }
  }

  /** Renders the cell into PH.cv (battery-sized) */
  function drawCell(t) {
    const { MW, MH } = PH, m = PH.cv.getContext('2d'), ts = t / 1000, th = theme, charging = isCharging();
    const ox = Math.sin(ts * 0.11) * MW * 0.012, oy = Math.cos(ts * 0.08) * MH * 0.01;
    const lx = -MW * MARGIN + ox, ly = -MH * MARGIN + oy, lw = MW * (1 + 2 * MARGIN), lh = MH * (1 + 2 * MARGIN);
    m.setTransform(dpr, 0, 0, dpr, 0, 0);
    m.globalCompositeOperation = 'source-over'; m.globalAlpha = 1;
    m.drawImage(PH.back, lx, ly, lw, lh);
    if (t - PH.glowAt > 90) { PH.glowAt = t; buildGlow(th); }
    // Stored lithium: the anode bands light up from the bottom to the charge level
    m.globalCompositeOperation = 'lighter';
    m.globalAlpha = 0.45 + (charging ? 0.08 * Math.sin(ts * 3) : 0);
    m.drawImage(PH.glow, lx, ly, lw, lh);
    m.globalAlpha = 1;

    m.save(); m.translate(ox, oy);
    // Ion chains: tiny beads of light on a thread, crossing the separators
    for (const c of PH.chains) {
      const pts = [];
      for (let i = c.absorbed; i < c.n; i++) pts.push([c.x - c.dir * i * c.gap, c.y + Math.sin(ts * 2 + c.ph + i * 0.9) * c.amp]);
      if (pts.length > 1) {
        m.beginPath(); pts.forEach(([x, y], i) => i ? m.lineTo(x, y) : m.moveTo(x, y));
        m.strokeStyle = rgba(th.flow, 0.35 * c.depth); m.lineWidth = Math.max(0.6, MW * 0.0025 * c.depth); m.stroke();
      }
      for (const [x, y] of pts) {
        const halo = MW * 0.05 * c.depth, core = MW * 0.02 * c.depth, dot = MW * 0.008 * c.depth;
        m.globalAlpha = 0.14 * c.depth; m.drawImage(spr.flow, x - halo, y - halo, halo * 2, halo * 2);
        m.globalAlpha = 1; m.drawImage(spr.flow, x - core / 2, y - core / 2, core, core);
        m.drawImage(spr.flow, x - dot / 2, y - dot / 2, dot, dot);
      }
    }
    for (const q of PH.flashes) {
      const r = MW * (0.01 + 0.025 * (1 - q.life)) * q.depth;
      m.globalAlpha = q.life * 0.8; m.drawImage(spr.flow, q.x - r, q.y - r, r * 2, r * 2);
    }
    m.globalAlpha = 1;
    m.restore();

    m.globalCompositeOperation = 'source-over';
    m.drawImage(PH.front, lx, ly, lw, lh);
  }

  // ---------- Photo style: camera flies into the battery when the view opens, then back out ----------
  let introStart = -1, introE = 0;
  const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  function introAt(t) {
    if (STYLE !== 'photo' || reduceMotion) return 0;
    if (introStart < 0) introStart = t;
    const s = (t - introStart) / 1000;
    if (s < 0.6) return 0;
    if (s < 2.2) return easeInOut((s - 0.6) / 1.6);
    if (s < 3.6) return 1;
    if (s < 5.4) return 1 - easeInOut((s - 3.6) / 1.8);
    return 0;
  }

  // ---------- Per-frame drawing ----------
  function drawXray(t) {
    const ts = t / 1000, th = theme, charging = isCharging();
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(base, 0, 0, W, H);
    const draining = isDraining(), powered = draining || charging;

    // Glowing current path
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath(); path.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(th.flow, charging ? 0.22 + 0.06 * Math.sin(ts * 4) : draining ? 0 : 0.04); ctx.lineWidth = S(0.012); ctx.stroke();
    for (const dp of drainPaths) {
      ctx.beginPath(); dp.p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.strokeStyle = rgba(th.flow, draining ? 0.1 + 0.03 * Math.sin(ts * 2) : powered ? 0.06 + 0.02 * Math.sin(ts * 2) : 0.03);
      ctx.lineWidth = S(0.008); ctx.stroke();
      const [ex, ey] = dp.p[dp.p.length - 1], rad = S(0.05 + 0.07 * dp.heat);
      const hg = ctx.createRadialGradient(ex, ey, 0, ex, ey, rad);
      hg.addColorStop(0, rgba(th.hot, 0.15 + 0.45 * dp.heat)); hg.addColorStop(1, rgba(th.hot, 0));
      ctx.fillStyle = hg; ctx.fillRect(ex - rad, ey - rad, rad * 2, rad * 2);
    }
    ctx.globalCompositeOperation = 'source-over';

    // ----- Glass battery -----
    const { x, y, w, h, r, ix, iy, iw, ih, fins, gap, fw } = BAT;
    const levelY = iy + ih * (1 - p / 100);
    rr(ctx, x, y, w, h, r);
    ctx.fillStyle = 'rgba(4,9,18,0.62)'; ctx.fill();
    ctx.fillStyle = rgba(th.glass, 0.05); ctx.fill();

    ctx.save(); rr(ctx, ix, iy, iw, ih, S(0.02)); ctx.clip();
    if (STYLE === 'photo') {
      // Photo style: a macro shot of the cell instead of the glowing plates
      drawCell(t);
      ctx.drawImage(PH.cv, ix, iy, iw, ih);
    } else {
    const amp =Math.min(S(0.012), ih * 0.012) * (charging ? 1 : 0.3);
    const wave = i => Math.sin(ts * 2.6 + i * 0.7) * amp;
    const lit = ctx.createLinearGradient(0, levelY, 0, iy + ih);
    lit.addColorStop(0, rgba(th.bright, 0.95)); lit.addColorStop(0.08, rgba(th.hot, 0.92)); lit.addColorStop(0.45, rgba(th.deep, 0.9)); lit.addColorStop(1, rgba(mix(th.deep, [0, 0, 0], 0.4), 0.9));
    const edge = Math.max(1, fw * 0.12);
    for (let i = 0; i < fins; i++) {
      const fx = ix + i * (fw + gap);
      const ly = Math.min(iy + ih, Math.max(iy, levelY + wave(i)));
      ctx.fillStyle = 'rgba(42,50,64,0.5)'; ctx.fillRect(fx, iy, fw, ly - iy);
      ctx.fillStyle = lit; ctx.fillRect(fx, ly, fw, iy + ih - ly);
      ctx.fillStyle = 'rgba(220,232,250,0.13)'; ctx.fillRect(fx, iy, edge, ih);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(fx + fw - edge, iy, edge, ih);
    }
    ctx.globalCompositeOperation = 'lighter';
    let g = ctx.createLinearGradient(0, levelY - S(0.08), 0, levelY + S(0.12));
    g.addColorStop(0, rgba(th.hot, 0)); g.addColorStop(0.4, rgba(th.hot, charging ? 0.5 + 0.1 * Math.sin(ts * 7) : 0.25)); g.addColorStop(1, rgba(th.hot, 0));
    ctx.fillStyle = g; ctx.fillRect(ix, levelY - S(0.08), iw, S(0.2));
    ctx.beginPath();
    for (let i = 0; i < fins; i++) { const xx = ix + i * (fw + gap) + fw / 2, yy = levelY + wave(i); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.strokeStyle = rgba(th.bright, 0.9); ctx.lineWidth = Math.max(1.5, S(0.005)); ctx.stroke();
    for (const b of bubbles) { const sz = b.r * 2.4; ctx.drawImage(spr.ring, b.x - sz / 2, b.y - sz / 2, sz, sz); }
    for (const q of drops) { ctx.drawImage(spr.blue, q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
    for (const q of splashes) { ctx.globalAlpha = Math.max(0, q.life); const sz = S(0.02); ctx.drawImage(spr.blue, q.x - sz / 2, q.y - sz / 2, sz, sz); }
    ctx.globalAlpha = 1;
    for (const q of rises) ctx.drawImage(spr.blue, q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    ctx.globalAlpha = 1;
    }
    ctx.restore();

    // Battery glass shell
    ctx.save();
    rr(ctx, x, y, w, h, r);
    ctx.shadowColor = rgba(th.glass, 1); ctx.shadowBlur = S(0.05);
    ctx.strokeStyle = rgba(mix(th.glass, WHITE, 0.3), 0.85); ctx.lineWidth = Math.max(1.5, S(0.006)); ctx.stroke();
    ctx.restore();
    rr(ctx, x + S(0.012), y + S(0.012), w - S(0.024), h - S(0.024), r * 0.8);
    ctx.strokeStyle = rgba(th.glass, 0.22); ctx.lineWidth = 1; ctx.stroke();
    ctx.save(); rr(ctx, x, y, w, h, r); ctx.clip();
    g = ctx.createLinearGradient(x, y, x + w * 0.6, y + h * 0.4);
    g.addColorStop(0, 'rgba(255,255,255,0.14)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.beginPath(); ctx.moveTo(x + w * 0.62, y); ctx.lineTo(x + w * 0.74, y); ctx.lineTo(x + w * 0.28, y + h); ctx.lineTo(x + w * 0.16, y + h); ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill();
    ctx.restore();
    if (CFG.dual) {
      ctx.save(); ctx.setLineDash([S(0.02), S(0.012)]);
      ctx.beginPath(); ctx.moveTo(x + S(0.03), y + h / 2); ctx.lineTo(x + w - S(0.03), y + h / 2);
      ctx.strokeStyle = rgba(mix(th.glass, WHITE, 0.3), 0.6); ctx.lineWidth = Math.max(1, S(0.004)); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(220,235,255,0.35)'; ctx.font = `600 ${S(0.03)}px "Exo 2", sans-serif`;
    ctx.fillText(CFG.label, ix + S(0.02), iy + S(0.05));

    // Current flowing along the path
    ctx.globalCompositeOperation = 'lighter';
    for (const q of flow) {
      const [fx, fy] = along(q.d);
      const horiz = Math.abs(along(q.d + 2)[0] - fx) > Math.abs(along(q.d + 2)[1] - fy);
      const ox = horiz ? 0 : q.off, oy = horiz ? q.off : 0;
      ctx.globalAlpha = q.fade === undefined ? 1 : Math.max(0, q.fade);
      ctx.drawImage(spr.flow, fx + ox - q.size / 2, fy + oy - q.size / 2, q.size, q.size);
    }
    ctx.globalAlpha = 1;
    for (const q of drains) {
      const pp = drainPaths[q.di].p, [fx, fy] = along(q.d, pp), [nx, ny] = along(q.d + 2, pp);
      const horiz = Math.abs(nx - fx) > Math.abs(ny - fy);
      ctx.drawImage(spr.flow, fx + (horiz ? 0 : q.off) - q.size / 2, fy + (horiz ? q.off : 0) - q.size / 2, q.size, q.size);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function draw(t) {
    const th = theme;
    let g;
    // Photo style opens with a fly-in: the camera moves into the battery and back out
    introE = introAt(t);
    if (introE > 0) {
      const bx = BAT.x + BAT.w / 2, by = BAT.y + BAT.h / 2, z = 1 + (Math.min(W * 0.98 / BAT.w, H * 0.95 / BAT.h) - 1) * introE;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.translate(bx + (W / 2 - bx) * introE, by + (H / 2 - by) * introE); ctx.scale(z, z); ctx.translate(-bx, -by);
      drawXray(t);
      ctx.restore();
    } else drawXray(t);

    // ----- Display glass on top (fades out with the black display) -----
    const black = blackness();
    ctx.save(); rr(ctx, px, py, pw, ph, S(0.1)); ctx.clip();
    ctx.globalAlpha = black;
    g = ctx.createLinearGradient(px, py, px + pw, py + ph);
    g.addColorStop(0, 'rgba(150,190,255,0.07)'); g.addColorStop(0.35, 'rgba(255,255,255,0.0)');
    g.addColorStop(0.42, 'rgba(255,255,255,0.05)'); g.addColorStop(0.5, 'rgba(255,255,255,0.0)'); g.addColorStop(1, 'rgba(120,170,255,0.05)');
    ctx.fillStyle = g; ctx.fillRect(px, py, pw, ph);
    ctx.restore();
    drawDarkness();

    // ----- Charge readout: it lives on the black display and fades with it -----
    const shown = black * black; // fade a bit ahead of the darkness so nothing ghosts over the clean board
    if (shown < 0.01) return;
    ctx.globalAlpha = shown;
    const cx = CUT ? CUT.x : X(0.5), cy = CUT ? CUT.y : Y(0.04), hole = CUT ? CUT.r : S(0.03), ringR = Math.max(S(0.052), hole + S(0.02));
    g = ctx.createRadialGradient(cx, cy + S(0.17), 0, cx, cy + S(0.17), S(0.4));
    g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - S(0.45), cy - S(0.1), S(0.9), S(0.55));
    // (No ring around the front camera: it could not sit exactly on every punch hole.
    // ringR is kept only to place the readout below the camera.)

    const str = p.toFixed(3), [ip, dp] = str.split('.');
    const big = S(0.19), small = S(0.075);
    ctx.font = `200 ${big}px Outfit, sans-serif`;
    const advB = ctx.measureText('0').width;
    ctx.font = `300 ${small}px Outfit, sans-serif`;
    const advS = ctx.measureText('0').width, dotW = small * 0.32, pctW = ctx.measureText('%').width;
    const total = advB * ip.length + dotW + advS * dp.length + small * 0.15 + pctW;
    let tx = cx - total / 2;
    const base1 = cy + ringR + S(0.03) + big * 0.78;
    ctx.save();
    ctx.shadowColor = rgba(th.display, 0.8); ctx.shadowBlur = S(0.05);
    ctx.fillStyle = rgba(mix(th.display, WHITE, 0.55), 1); ctx.textAlign = 'center';
    ctx.font = `200 ${big}px Outfit, sans-serif`;
    for (const ch of ip) { ctx.fillText(ch, tx + advB / 2, base1); tx += advB; }
    ctx.font = `300 ${small}px Outfit, sans-serif`;
    ctx.fillText('.', tx + dotW / 2, base1); tx += dotW;
    for (const ch of dp) { ctx.fillText(ch, tx + advS / 2, base1); tx += advS; }
    tx += small * 0.15; ctx.textAlign = 'left'; ctx.fillText('%', tx, base1);
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.font = `500 ${S(0.038)}px Outfit, sans-serif`;
    ctx.fillStyle = rgba(th.display, 0.9);
    let label;
    if (mode === 'demo' && !running) label = 'Paused';
    else if (!pluggedIn()) label = (p < 20 ? 'Low battery' : 'On battery') + (mode === 'demo' || (mode === 'native' && watt >= 0.1) ? `  −${watt}W` : '');
    else if (p >= 99.999 || (mode === 'real' && realInt >= 100) || (mode === 'native' && nat.full)) label = 'Fully charged';
    else if (mode === 'native') label = watt >= 0.5 ? `${speedLabel(watt)}  ${watt}W` : 'Charging';
    else label = mode === 'real' ? 'Charging' : `${speedLabel(watt)}  ${watt}W`;
    ctx.fillText(label, cx, base1 + S(0.07));
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  /** Charging speed names: slow under 10 W, fast to 40 W, ultra to 100 W, insane from 100 W */
  function speedLabel(w) {
    return w >= 100 ? 'Insane charging' : w >= 40 ? 'Ultra charging' : w >= 10 ? 'Fast charging' : 'Slow charging';
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    update(t, dt);
    if (STYLE === 'photo') updatePhoto(t, dt);
    reveal += (revealTarget - reveal) * Math.min(1, dt * 14);
    draw(t);
    requestAnimationFrame(frame);
  }

  // Swipe up from the lower part of the screen opens the ellipse (to clean board by
  // about the middle of the screen); swipe down closes it to ~95% dark.
  // Only the view changes: the charge animation keeps running untouched.
  let drag = null, dragged = false;
  C.addEventListener('pointerdown', e => { drag = { id: e.pointerId, y: e.clientY, from: revealTarget }; dragged = false; });
  C.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = drag.y - e.clientY;
    if (!dragged && Math.abs(dy) < 12) return;
    dragged = true;
    revealTarget = clamp01(drag.from + dy / (H * 0.45));
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    if (dragged) { try { localStorage.setItem('tdc.reveal', revealTarget.toFixed(3)); } catch (_) {} }
  };
  C.addEventListener('pointerup', endDrag);
  C.addEventListener('pointercancel', endDrag);

  // ---------- Settings ----------
  const panel = document.getElementById('panel'), hint = document.getElementById('hint');
  let hintTimer = setTimeout(() => hint.style.opacity = 0, 3500);
  if (NATIVE) { hint.style.display = 'none'; panel.style.display = 'none'; }
  C.addEventListener('click', () => { if (dragged) { dragged = false; return; } if (NATIVE) { window.AndroidBattery.onTap(); return; } panel.classList.toggle('open'); hint.style.opacity = 0; clearTimeout(hintTimer); keepAwake(); });
  document.getElementById('close').addEventListener('click', () => panel.classList.remove('open'));
  function setRunning(on) {
    running = on;
    document.getElementById('pause').textContent = on ? 'Пауза' : 'Продължи';
  }
  document.getElementById('pause').addEventListener('click', () => setRunning(!running));
  const speedEl = document.getElementById('speed');
  speedEl.addEventListener('input', () => { speed = parseFloat(speedEl.value); document.getElementById('spd').textContent = speed + '×'; });
  const mCharge = document.getElementById('mCharge'), mDrain = document.getElementById('mDrain'), mReal = document.getElementById('mReal');
  function select(btn) { [mCharge, mDrain, mReal].forEach(b => b.classList.toggle('on', b === btn)); }
  function showDemoControls(on) { ['pause', 'restart', 'speedRow'].forEach(id => document.getElementById(id).style.display = on ? '' : 'none'); }
  mCharge.addEventListener('click', () => {
    if (mode === 'real') p = 40;
    mode = 'demo'; demoState = 'charge'; holdUntil = 0; select(mCharge); showDemoControls(true); setRunning(true);
    document.getElementById('status').textContent = 'Симулирано зареждане от 40% до 99.999%';
  });
  mDrain.addEventListener('click', () => {
    if (mode === 'real' || p >= 99.999) p = 45;
    mode = 'demo'; demoState = 'drain'; holdUntil = 0; select(mDrain); showDemoControls(true); setRunning(true);
    document.getElementById('status').textContent = 'Симулирано разреждане. Под 20% става червено.';
  });
  mReal.addEventListener('click', async () => {
    if (!bat && !(await initBattery())) return;
    mode = 'real'; select(mReal); showDemoControls(false); lastStats = 0;
  });
  document.getElementById('restart').addEventListener('click', () => { p = demoState === 'drain' ? 45 : 40; holdUntil = 0; setRunning(true); });

  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* retried on the next tap */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  if (NATIVE) setInterval(() => {
    C.style.transform = `translate(${Math.round((Math.random() - 0.5) * 6)}px, ${Math.round((Math.random() - 0.5) * 6)}px)`;
  }, 60000);
  window.addEventListener('resize', layout);
  initTheme();
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  keepAwake();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
